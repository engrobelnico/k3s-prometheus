kube-prometheus-stack:
    namespaceOverride: "prometheus"
    grafana:
       grafana.ini:
        server:
          domain: kube.local
          protocol: http
          root_url: "%(protocol)s://%(domain)s/grafana/"
          serve_from_sub_path: true
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/home.json
    prometheus-node-exporter:
      service:
         port: 9200
         targetPort: 9200
      hostRootFsMount: 
        enabled: false
        mountPropagation: HostToContainer
    prometheus:
      prometheusSpec:
        externalUrl: "http://kube.local/prometheus/"
        routePrefix: /prometheus
        # Enable remoteWrite only after OpenSearch is installed and
        # opensearch-admin-password exists in namespace prometheus.
        # remoteWrite:
        #   - url: "https://opensearch.opensearch.svc.cluster.local:9200/_plugins/_observability/prometheus"
        #     tlsConfig:
        #       insecureSkipVerify: true
        #     basicAuth:
        #       username:
        #         name: opensearch-admin-password
        #         key: username
        #       password:
        #         name: opensearch-admin-password
        #         key: password
        additionalScrapeConfigs :
        - job_name: 'kyverno'
          # retreive argocd values.
          metrics_path: /metrics 
          scrape_interval: 5s
          static_configs:
            - targets: ['kyverno-svc-metrics.kyverno.svc.cluster.local:8000']
        - job_name: 'traefik'
          # retreive argocd values.
          metrics_path: /metrics 
          scrape_interval: 5s
          static_configs:
            - targets: ['traefik-metrics.kube-system.svc.cluster.local:9100']
        - job_name: 'kyverno-policies'
          # retreive argocd values.
          metrics_path: / 
          scrape_interval: 5s
          static_configs:
            - targets: ['policy-reporter.kyverno.svc.cluster.local:8080']
        - job_name: 'argocd'
          # retreive argocd values.
          metrics_path: /metrics 
          scrape_interval: 5s
          static_configs:
            - targets: ['argocd-metrics.argocd.svc.cluster.local:8082']
        - job_name: 'prometheus'
          static_configs:
            - targets: ['prometheus-operated:9090']  
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\\d+)?;(\\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (http?)
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_container_name]
              action: replace
              target_label: container
        #- job_name: "kubernetes-pods"
        #  kubernetes_sd_configs:
        #    - role: pod
        #  relabel_configs:
        #    - action: labelmap
        #      regex: __meta_kubernetes_pod_label_(.+)
            # Expose Pod namespace as metric namespace label
        #    - source_labels: [__meta_kubernetes_namespace]
        #      action: replace
        #      target_label: namespace
            # Expose Pod name as metric name label
        #    - source_labels: [__meta_kubernetes_pod_name]
        #      action: replace
        #      target_label: pod

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter
  namespaceOverride: prometheus
  # required so kube-prometheus-stack's default serviceMonitorSelector picks up this ServiceMonitor
  releaseLabel: true
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          follow_redirects: true
          preferred_ip_protocol: "ip4"
      github_status:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: "ip4"
          # fails (probe_success=0) unless GitHub reports every component as fully operational
          fail_if_body_not_matches_regexp:
            - "\"indicator\":\"none\""
  serviceMonitor:
    enabled: true
    defaults:
      interval: 60s
      scrapeTimeout: 30s
      module: http_2xx
    targets:
      - name: github-status-overall
        url: https://www.githubstatus.com/api/v2/status.json
        module: github_status
      - name: github-com
        url: https://github.com
        module: http_2xx
      - name: github-api
        url: https://api.github.com
        module: http_2xx
      - name: github-git-operations
        url: https://www.githubstatus.com/api/v2/components.json
        module: http_2xx